[project]
name = "ctcbench-real"
version = "0.1.0"
description = "CTC-Bench (corpus task complexity) as RLMTrainEnv environments."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "pyarrow",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctcbench_real", "ctc_core_env"]

[project.entry-points."verifiers.environments"]
ctcbench-real = "ctcbench_real:load_environment"
ctc-core-env = "ctc_core_env:load_environment"
