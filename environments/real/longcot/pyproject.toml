[project]
name = "longcot-real"
version = "0.2.0"
description = "LongCoT long-horizon reasoning (official longcot questions and verifiers) wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
    "openai",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longcot_real"]

[project.entry-points."verifiers.environments"]
longcot-real = "longcot_real:load_environment"
