[project]
name = "loogle-v2-real"
version = "0.1.0"
description = "LooGLE-v2 real-world long-context reasoning, wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
    "huggingface-hub>=0.20",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loogle_v2_real"]

[project.entry-points."verifiers.environments"]
loogle-v2-real = "loogle_v2_real:load_environment"
