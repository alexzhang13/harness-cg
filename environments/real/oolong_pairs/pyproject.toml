[project]
name = "oolong-pairs-real"
version = "0.1.0"
description = "OOLONG-Pairs pairwise aggregation QA as an RLMTrainEnv environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
    "huggingface_hub>=0.24",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oolong_pairs_real"]

[tool.hatch.build]
include = ["oolong_pairs_real/**/*.py", "oolong_pairs_real/data/*.json", "pyproject.toml", "README.md"]

[project.entry-points."verifiers.environments"]
oolong-pairs-real = "oolong_pairs_real:load_environment"
