[project]
name = "graphwalks-real"
version = "0.1.0"
description = "GraphWalks long-context graph-traversal benchmark (BFS / Parents), wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm-train", "verifiers>=0.1.11", "datasets>=4.0", "huggingface_hub>=0.24", "pyarrow>=15"]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphwalks_real"]

[project.entry-points."verifiers.environments"]
graphwalks-real = "graphwalks_real:load_environment"
