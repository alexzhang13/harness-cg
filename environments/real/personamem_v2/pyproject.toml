[project]
name = "personamem-v2-real"
version = "0.1.0"
description = "PersonaMem-v2 (implicit-persona long-context personalization MCQ) real-sub-LLM environment for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "pandas>=2.0",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personamem_v2"]

[project.entry-points."verifiers.environments"]
personamem-v2-real = "personamem_v2:load_environment"
