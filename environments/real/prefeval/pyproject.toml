[project]
name = "prefeval-real"
version = "0.1.0"
description = "PrefEval (ICLR 2025) preference-following classification task for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prefeval_real"]

[project.entry-points."verifiers.environments"]
prefeval-real = "prefeval_real:load_environment"
