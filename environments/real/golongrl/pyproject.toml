[project]
name = "golongrl-real"
version = "0.1.0"
description = "GoLongRL (Kwai-Klear) table and summary families as an RLMTrainEnv environment."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "pyarrow>=15",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golongrl_real"]

[project.entry-points."verifiers.environments"]
golongrl-real = "golongrl_real:load_environment"
