[project]
name = "babilong-real"
version = "0.1.0"
description = "BABILong (bAbI facts hidden in a PG19 haystack) environment for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babilong_real"]

[project.entry-points."verifiers.environments"]
babilong-real = "babilong_real:load_environment"
