[project]
name = "personamem-v3-real"
version = "0.1.0"
description = "PersonaMem-v3 hidden-persona recommendation (deterministic slate ranking) as an RLMTrainEnv environment."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personamem_v3"]

[project.entry-points."verifiers.environments"]
personamem-v3-real = "personamem_v3:load_environment"
