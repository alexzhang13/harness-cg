[project]
name = "longproc-real"
version = "0.1.0"
description = "LongProc theory-of-mind tracking (2k / 8k), wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longproc_real"]

[project.entry-points."verifiers.environments"]
longproc-real = "longproc_real:load_environment"
