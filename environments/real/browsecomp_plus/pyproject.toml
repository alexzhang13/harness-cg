[project]
name = "browsecomp-plus-real"
version = "0.1.0"
description = "BrowseComp-Plus as an RLMTrainEnv environment."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browsecomp_plus_real"]
# The split id files ship inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"browsecomp_plus_real/data/test.txt" = "browsecomp_plus_real/data/test.txt"
"browsecomp_plus_real/data/train.txt" = "browsecomp_plus_real/data/train.txt"
"browsecomp_plus_real/data/dev2.txt" = "browsecomp_plus_real/data/dev2.txt"

[project.entry-points."verifiers.environments"]
browsecomp-plus-real = "browsecomp_plus_real:load_environment"
