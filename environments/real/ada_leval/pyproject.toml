[project]
name = "ada-leval-real"
version = "0.1.0"
description = "Ada-LEval BestAnswer (StackSelect) long-context answer selection, wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=2.20",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ada_leval_real"]

[tool.hatch.build]
include = ["ada_leval_real/**/*.py", "ada_leval_real/bestanswer_disjoint_manifest.json", "pyproject.toml", "README.md"]

[project.entry-points."verifiers.environments"]
ada-leval-real = "ada_leval_real:load_environment"
