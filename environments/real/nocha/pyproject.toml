[project]
name = "nocha-real"
version = "0.1.0"
description = "NoCha book-length claim verification, wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm-train", "verifiers>=0.1.11", "datasets>=4.0"]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nocha_real"]

[project.entry-points."verifiers.environments"]
nocha-real = "nocha_real:load_environment"
