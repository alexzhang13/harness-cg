[project]
name = "loongrl-real"
version = "0.1.0"
description = "LoongRL / KeyChain-15K long-context multi-hop QA environment for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "pyarrow>=15",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loongrl_real"]

[project.entry-points."verifiers.environments"]
loongrl-real = "loongrl_real:load_environment"
