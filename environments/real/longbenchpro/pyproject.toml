[project]
name = "longbenchpro-real"
version = "0.1.0"
description = "LongBench-Pro long-context tasks, wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm-train", "verifiers>=0.1.11", "datasets>=4.0", "pytrec-eval-terrier>=0.5.6"]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longbenchpro_real"]

[project.entry-points."verifiers.environments"]
longbenchpro-real = "longbenchpro_real:load_environment"
