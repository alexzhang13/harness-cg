[project]
name = "fanoutqa-real"
version = "0.1.0"
description = "FanOutQA (ACL 2024) multi-hop multi-document Wikipedia QA environment for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "fanoutqa==1.1.1",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fanoutqa_real"]

[project.entry-points."verifiers.environments"]
fanoutqa-real = "fanoutqa_real:load_environment"
