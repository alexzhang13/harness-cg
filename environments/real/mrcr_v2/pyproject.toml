[project]
name = "mrcr-v2-real"
version = "0.1.0"
description = "MRCR v2 multi-needle context recall benchmark, wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm-train", "verifiers>=0.1.11", "datasets>=4.0"]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrcr_v2_real"]

[project.entry-points."verifiers.environments"]
mrcr-v2-real = "mrcr_v2_real:load_environment"
