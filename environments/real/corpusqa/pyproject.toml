[project]
name = "corpusqa-real"
version = "0.1.0"
description = "CorpusQA multi-document aggregation QA (128k / 1M), wired through RLMTrainEnv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
    "huggingface-hub>=0.20",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpusqa_real"]

[project.entry-points."verifiers.environments"]
corpusqa-real = "corpusqa_real:load_environment"
