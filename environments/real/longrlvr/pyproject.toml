[project]
name = "longrlvr-real"
version = "0.1.0"
description = "LongRLVR (ICLR 2026) grounded long-document QA environment for RLMTrainEnv."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11.dev0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "pyarrow>=15",
    "rlm-train",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longrlvr_real"]

[project.entry-points."verifiers.environments"]
longrlvr-real = "longrlvr_real:load_environment"
