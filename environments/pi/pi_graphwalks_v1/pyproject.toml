[project]
name = "pi-graphwalks-v1"
version = "0.1.0"
description = "Pi baseline for GraphWalks (verifiers v1 vf.Pi)."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "graphwalks-real",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
graphwalks-real = { path = "../../real/graphwalks", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_graphwalks_v1"]

[project.entry-points."verifiers.environments"]
pi-graphwalks-v1 = "pi_graphwalks_v1:load_environment"
