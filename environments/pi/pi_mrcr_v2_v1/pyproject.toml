[project]
name = "pi-mrcr-v2-v1"
version = "0.1.0"
description = "Pi baseline for MRCR v2 (verifiers v1 vf.Pi)."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "mrcr-v2-real",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
mrcr-v2-real = { path = "../../real/mrcr_v2", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_mrcr_v2_v1"]

[project.entry-points."verifiers.environments"]
pi-mrcr-v2-v1 = "pi_mrcr_v2_v1:load_environment"
