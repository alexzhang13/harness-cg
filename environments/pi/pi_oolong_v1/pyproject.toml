[project]
name = "pi-oolong-v1"
version = "0.1.0"
description = "Pi baseline for OOLONG (verifiers v1 vf.Pi)."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "oolong-real",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
oolong-real = { path = "../../real/oolong", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_oolong_v1"]

[project.entry-points."verifiers.environments"]
pi-oolong-v1 = "pi_oolong_v1:load_environment"
