[project]
name = "browsecomp-plus-synth"
version = "0.1.0"
description = "Synthetic BrowseComp-Plus: find one entity in a ~27k-document generated encyclopedia, fake sub-LM."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "synth-common",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

[project.entry-points."verifiers.environments"]
browsecomp-plus-synth = "browsecomp_plus_synth:load_environment"

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
synth-common = { path = "../synth_common", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browsecomp_plus_synth"]
