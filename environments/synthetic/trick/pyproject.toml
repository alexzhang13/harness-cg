[project]
name = "trick-synth"
version = "0.1.0"
description = "Synthetic OBLIQ-shaped analogical retrieval (generated problems, hidden core technique); fake sub-LM calibrated to the real 27B."
requires-python = ">=3.11"
dependencies = ["synth-common", "rlm-train", "verifiers>=0.1.11", "datasets>=4.0"]

[tool.uv.sources]
synth-common = { path = "../synth_common", editable = true }
rlm-train = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trick_synth"]

[project.entry-points."verifiers.environments"]
trick-synth = "trick_synth:load_environment"
