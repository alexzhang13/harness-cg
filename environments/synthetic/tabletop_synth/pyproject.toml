[project]
name = "tabletop-synth"
version = "0.1.0"
description = "Synthetic D&D session logs (varied surface, exact roll / spell gold) for OOLONG-real program distillation with a real sub-LM."
requires-python = ">=3.11"
dependencies = ["rlm-train", "oolong-real-synth", "verifiers>=0.1.11", "datasets>=4.0"]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
oolong-real-synth = { path = "../oolong_real", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tabletop_synth"]

[project.entry-points."verifiers.environments"]
tabletop-synth = "tabletop_synth:load_environment"
