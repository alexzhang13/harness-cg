[project]
name = "expertlongbench-synth"
version = "0.1.0"
description = "Fast synthetic ExpertLongBench env: checklist extraction from long case files with a fake sub-LM."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "synth-common",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
synth-common = { path = "../synth_common", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expertlongbench_synth"]
