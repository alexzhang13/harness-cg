[project]
name = "corpusqa-synth"
version = "0.1.0"
description = "Fast synthetic RLM training env for CorpusQA (periodic statistical releases + entity filings, fake sub-LM)."
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "synth-common",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

[tool.uv.sources]
rlm-train = { path = "../../..", editable = true }
synth-common = { path = "../synth_common", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpusqa_synth"]

[project.entry-points."verifiers.environments"]
corpusqa-synth = "corpusqa_synth:load_environment"
