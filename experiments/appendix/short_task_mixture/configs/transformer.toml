# Table tab:generalization | base Transformer trained on the six short tasks (evaluated at step 420)

output_dir = "outputs/short-mix/transformer"
max_steps = 1000
seq_len = 106496

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-lengthgen"
name = "lengthgen-mix-short-30b-1000-singleturn"
shared = false

[deployment]
gpus_per_node = 6
num_train_gpus = 4
num_infer_gpus = 2

[trainer]

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",
    "gate_proj", "up_proj", "down_proj",
]

[trainer.ckpt]
interval = 60
keep_last = 2
weights_only = false
skip_gather_master_weights = true

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.85

[inference.model]
max_model_len = 106496
enforce_eager = false

[inference.parallel]
tp = 2
dp = 1

[orchestrator]
batch_size = 64
rollouts_per_example = 4
max_inflight_rollouts = 64

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = false
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[orchestrator.ckpt]
interval = 60
keep_last = 2

[orchestrator.train]
max_retries = 2

[orchestrator.train.sampling]
max_completion_tokens = 8192
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "adaleval-bestanswer-singleturn-8k-train"
ratio = 0.1667

[orchestrator.train.env.args]
task = "ada_leval_bestanswer"
setting = "8k"
num_examples = -1
manifest_split = "train"

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "graphwalks-singleturn-short-train"
ratio = 0.1667

[orchestrator.train.env.args]
task = "graphwalks"
split = "128k_and_shorter"
max_prompt_chars = 120000
num_examples = 512
seed = 42

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "longbenchpro-singleturn-en-32k-train"
ratio = 0.1667

[orchestrator.train.env.args]
task = "longbenchpro"
language = "English"
token_length = "32k"
num_examples = -1
seed = 42

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "mrcr-singleturn-2needle-32k-64k-train"
ratio = 0.1667

[orchestrator.train.env.args]
task = "mrcr"
needle_count = 2
context_range = "32k-64k"
num_examples = 512
seed = 42

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "oolong-singleturn-trec-32k-train"
ratio = 0.1667

[orchestrator.train.env.args]
task = "oolong"
dataset_name = "trec_coarse"
min_ctx = 32768
max_ctx = 32768
exclude_numeric = false
num_examples = -1
seed = 42

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "oolong-pairs-singleturn-8k-train"
ratio = 0.1665

[orchestrator.train.env.args]
task = "oolong_pairs"
context_length = 8192
num_examples = -1
seed = 42

[orchestrator.eval]
interval = 20
eval_base_model = true
num_examples = 20
rollouts_per_example = 1
max_retries = 2

[orchestrator.eval.sampling]
max_completion_tokens = 8192
[orchestrator.eval.sampling.extra_body]
enable_thinking = false

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-graphwalks-heldout"
num_examples = 20
[orchestrator.eval.env.args]
task = "graphwalks"
split = "128k_and_shorter"
max_prompt_chars = 120000
skip_examples = 512
num_examples = 20
seed = 42

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-longbenchpro-en-64k"
num_examples = 20
[orchestrator.eval.env.args]
task = "longbenchpro"
language = "English"
token_length = "64k"
num_examples = 20
seed = 7

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-mrcr-8needle-32k-64k"
num_examples = 20
[orchestrator.eval.env.args]
task = "mrcr"
needle_count = 8
context_range = "32k-64k"
num_examples = 20
seed = 7

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-oolong-trec-64k"
num_examples = 20
[orchestrator.eval.env.args]
task = "oolong"
dataset_name = "trec_coarse"
min_ctx = 65536
max_ctx = 65536
exclude_numeric = false
num_examples = 20
seed = 7

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-oolong-pairs-16k"
num_examples = 20
[orchestrator.eval.env.args]
task = "oolong_pairs"
context_length = 16384
num_examples = 20
seed = 7

[[orchestrator.eval.env]]
id = "singleturn-baseline"
name = "val-adaleval-bestanswer-32k"
num_examples = 20
[orchestrator.eval.env.args]
task = "ada_leval_bestanswer"
setting = "32k"
num_examples = 20
manifest_split = "train_long"
seed = 7
