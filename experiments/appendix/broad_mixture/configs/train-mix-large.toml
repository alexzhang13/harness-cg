# Appendix (broad mixture) | Qwen3-30B-A3B RL on 26 training streams; step 480 is the evaluated checkpoint

output_dir = "outputs/train-mix-large"
max_steps = 1000
seq_len = 8192

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-train-mix"
name = "train-mix-large"
shared = false

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[trainer]

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",
    "gate_proj", "up_proj", "down_proj",
]

[trainer.ckpt]
interval = 60
keep_last = 2
weights_only = false
skip_gather_master_weights = true

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
max_model_len = 24576
enforce_eager = false

[inference.parallel]
tp = 4
dp = 1

[orchestrator]
batch_size = 256
rollouts_per_example = 4
max_inflight_rollouts = 48

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = true
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = true

[orchestrator.ckpt]
interval = 60
keep_last = 2

[orchestrator.train]
max_retries = 2

[orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "babilong-real"
name = "babilong-qa3-32k-128k-train"
ratio = 0.0791

[orchestrator.train.env.args]
orchestrator_prompt = true
min_iterations = 2
source = "train"
task = "qa3"
length = ["32k", "64k", "128k"]
