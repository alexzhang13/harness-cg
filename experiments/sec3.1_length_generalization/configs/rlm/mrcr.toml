# Fig. length-gen | RLM | MRCRv2 (2 needles 32k-64k -> 8 needles 2m-4m)

output_dir = "outputs/length-gen/rlm/mrcr"
max_steps = 150
seq_len = 8192

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-lengthgen"
name = "lengthgen-mrcr-2ndl-64k-to-8ndl-4M-nohints"
shared = false

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[trainer]

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",
    "gate_proj", "up_proj", "down_proj",
]

[trainer.ckpt]
interval = 20
keep_last = 1

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
max_model_len = 16384
enforce_eager = false

[inference.parallel]
tp = 2
dp = 2

[orchestrator]
batch_size = 64
rollouts_per_example = 4

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = true
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = true

[orchestrator.ckpt]
interval = 20
keep_last = 1

[orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "mrcr-v2-real"
name = "mrcr-v2-2needle-64k-train"
ratio = 1.0

[orchestrator.train.env.args]
needle_count = 2
context_range = "32k-64k"
num_examples = 512
seed = 42
max_iterations = 20
sub_max_tokens = 4096
min_iterations = 2
min_subcall = 0

[orchestrator.eval]
interval = 10
eval_base_model = true
num_examples = 50
rollouts_per_example = 1

[orchestrator.eval.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.eval.env]]
id = "mrcr-v2-real"
name = "mrcr-v2-8needle-4M-eval"
num_examples = 50
rollouts_per_example = 1

[orchestrator.eval.env.args]
needle_count = 8
context_range = "2m-4m"
num_examples = 50
seed = 42
max_iterations = 20
sub_max_tokens = 4096
