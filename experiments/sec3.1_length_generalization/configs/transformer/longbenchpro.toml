# Fig. length-gen | base Transformer (single turn) | LongBench-Pro English (32k -> 256k)

output_dir = "outputs/length-gen/transformer/longbenchpro"
max_steps = 150
seq_len = 40960

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-lengthgen"
name = "lengthgen-longbenchpro-singleturn-en-32k-to-256k"
shared = false

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[trainer]

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",
    "gate_proj", "up_proj", "down_proj",
]

[trainer.ckpt]
interval = 10
keep_last = 16

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
max_model_len = 40960
enforce_eager = false

[inference.parallel]
tp = 2
dp = 2

[orchestrator]
batch_size = 64
rollouts_per_example = 4

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = false
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[orchestrator.ckpt]
interval = 10
keep_last = 2

[orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "singleturn-baseline"
name = "longbenchpro-singleturn-en-32k-train"
ratio = 1.0

[orchestrator.train.env.args]
task = "longbenchpro"
language = "English"
token_length = "32k"
num_examples = -1
seed = 42

[orchestrator.eval]
interval = 100000
eval_base_model = false
