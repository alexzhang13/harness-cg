task = "mrcr"

[eval]
num_examples = 50
rollouts_per_example = 1

[eval.sampling]
temperature = 0.7
max_completion_tokens = 4096
extra_body = { enable_thinking = false, top_p = 0.8, top_k = 20, min_p = 0.0 }

[[eval.env]]
id = "pi-mrcr-v2-v1"
name = "mrcr-v2-8needle-4M-eval"
num_examples = 50
rollouts_per_example = 1

[eval.env.args]
needle_count = 8
context_range = "2m-4m"
num_examples = 50
seed = 42
max_turns = 30
