# Table main-composition | Qwen3-30B-A3B + RL (synthetic tasks): LoRA on the eight synthetic environments

output_dir = "outputs/rl-8task-30b-a3b"
max_steps = 500
seq_len = 32768
max_async_level = 1

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-8task-rl"
name = "rl-8task-30b-a3b"
shared = false

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[trainer]
dist_timeout_seconds = 1800

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt]
interval = 30
keep_last = 2
weights_only = false
skip_gather_master_weights = true

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
max_model_len = 131072
enforce_eager = false

[inference.parallel]
tp = 4
dp = 1

[orchestrator]
batch_size = 64
rollouts_per_example = 4
max_inflight_rollouts = 64

[orchestrator.buffer]
online_difficulty_filtering = true
easy_threshold = 1.0
hard_threshold = 0.0

[orchestrator.advantage]
[orchestrator.advantage.length_penalty]
type = "turns"

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = true
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = true

[orchestrator.ckpt]
interval = 30
keep_last = 2

[orchestrator.train]
max_retries = 2

[orchestrator.train.sampling]
max_completion_tokens = 6000
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "rlstage-bcp"
name = "bcp-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 2000

[[orchestrator.train.env]]
id = "rlstage-ctc"
name = "ctc-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 2000
seed = 7

[[orchestrator.train.env]]
id = "rlstage-elb"
name = "elb-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 4000

[[orchestrator.train.env]]
id = "rlstage-corpusqa"
name = "cqa-synth-train-1m"
ratio = 0.0625

[orchestrator.train.env.args]
split = "train"
num_examples = 2000
scale = "1m"

[[orchestrator.train.env]]
id = "rlstage-corpusqa"
name = "cqa-synth-train-128k"
ratio = 0.0625

[orchestrator.train.env.args]
split = "train"
num_examples = 2000
scale = "128k"

[[orchestrator.train.env]]
id = "rlstage-loogle"
name = "loogle-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 2000

[[orchestrator.train.env]]
id = "rlstage-oolong"
name = "oolong-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 2000

[[orchestrator.train.env]]
id = "rlstage-longreason"
name = "longreason-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"

[[orchestrator.train.env]]
id = "rlstage-obliq"
name = "obliq-synth-train"
ratio = 0.125

[orchestrator.train.env.args]
split = "train"
num_examples = 2000

[orchestrator.eval]
interval = 20
eval_base_model = true
num_examples = 25
rollouts_per_example = 1
max_retries = 2

[orchestrator.eval.sampling]
max_completion_tokens = 6000

[[orchestrator.eval.env]]
id = "ctcbench-real"
name = "val-ctc-v1"
num_examples = 25

[orchestrator.eval.env.args]
task = "outlier,contradiction_iid,grouping,reorder,hotpotqa"
split = "val"
split_version = "v1"
per_task_examples = 5
seed = 7
max_iterations = 30

[[orchestrator.eval.env]]
id = "corpusqa-real"
name = "val-cqa-128k-financial"
num_examples = 13

[orchestrator.eval.env.args]
set_name = "128k"
domain = "financial_en"
num_examples = 13
seed = 7

[[orchestrator.eval.env]]
id = "corpusqa-real"
name = "val-cqa-128k-education"
num_examples = 12

[orchestrator.eval.env.args]
set_name = "128k"
domain = "education_en"
num_examples = 12
seed = 7

[[orchestrator.eval.env]]
id = "rlstage-oolong-real-val"
name = "val-oolong-real-c2"
num_examples = 25

[orchestrator.eval.env.args]
path = "${OOLONG_REAL_DATA_DIR}/dnd/validation.jsonl"
num_examples = 25
max_episodes = 3
seed = 0

[[orchestrator.eval.env]]
id = "browsecomp-plus-real"
name = "val-bcp-train25-wholecorpus"
num_examples = 25

[orchestrator.eval.env.args]
split = "train"
docs_per_query = "all"
require_answerable = true
num_examples = 25
seed = 7
