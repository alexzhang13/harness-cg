# RLM-27B: SFT of Qwen3.8-27B on the synthetic-environment traces (1 epoch, 1074 updates)

output_dir = "outputs/sft/rlm-27b"
max_steps = 1074
use_renderer = false
loss_impl = "liger_fused"

[model]
name = "Qwen/Qwen3.8-27B"
seq_len = 32768
optim_cpu_offload = true
optimization_dtype = "float32"
reduce_dtype = "float32"

[model.ac]
freq = 1

[tokenizer]
chat_template = "${REPO}/training/sft/qwen3.8_nothink_chat_template.jinja"

[data]
type = "sft"
name = "${SFT_DATA_DIR}/synth_full_clean_v2_turns"
splits = ["train"]
seq_len = 32768
pack_function = "cat"
micro_batch_size = 1
batch_size = 8
shuffle = true
seed = 0

[optim]
type = "adamw"
lr = 5e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "cosine"
warmup_steps = 3
min_lr = 1e-6

[ckpt]
interval = 179
weights_only = false
keep_last = 2

[ckpt.weights]

[deployment]
type = "single_node"
gpus_per_node = 8
num_gpus = 8

[wandb]
project = "rlm-sft"
name = "sft-qwen38-27b-synth-full-clean-v2"
