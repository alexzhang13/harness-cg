# Fig. strategy-gen | LM + REPL (enable_sub_llm = false) | OBLIQ writing -> math (pool 300)

output_dir = "outputs/strategy-gen/lm_repl/obliq_writing_to_math"
max_steps = 500
seq_len = 8192

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "rlm-strategygen"
name = "strategygen-obliq-writing-to-math-depth0"
shared = false

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[trainer]

[trainer.model]
fused_lm_head_token_chunk_size = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",
    "gate_proj", "up_proj", "down_proj",
]

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
max_model_len = 16384
enforce_eager = false

[inference.parallel]
tp = 4
dp = 1

[orchestrator]
batch_size = 64
rollouts_per_example = 4

[[orchestrator.filters]]
type = "gibberish"
enforce = false

[[orchestrator.filters]]
type = "repetition"
enforce = true
window = 3000
prob_threshold = 0.99

[[orchestrator.filters]]
type = "zero_advantage"
enforce = true

[orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "obliq-real"
name = "obliq-writing-train"
ratio = 1.0

[orchestrator.train.env.args]
task = "writing"
num_examples = -1
pool_size = 300
min_distractors = 10
metric = "ndcg@50"
doc_max_chars = 4000
seed = 42
max_iterations = 20
sub_max_tokens = 4096
min_iterations = 1
min_subcall = 0
enable_sub_llm = false
max_rollout_seconds = 1800
user_prologue = """Note on this retrieval task's `context` (a `list[str]` of candidate documents, one per element):
  - `len(context)` is the FULL candidate pool — mostly irrelevant distractors, with a handful of true matches mixed in. You cannot judge relevance from memory.
  - Strategy: delegate reading to `llm_query` / `llm_query_batched` over the candidate docs to score each one's relevance to the query (the analogical match described in the prompt), Python-sort by that score, and output a FULL ranking of all candidate doc_ids best-first. Borderline candidates go lower, not dropped, so they still count toward recall@50/@100. Do not try to read every doc inline."""

[orchestrator.eval]
interval = 10
eval_base_model = true
num_examples = 50
rollouts_per_example = 1

[orchestrator.eval.sampling]
max_completion_tokens = 4096
extra_body = { enable_thinking = false }

[[orchestrator.eval.env]]
id = "obliq-real"
name = "obliq-math-eval"
num_examples = 50
rollouts_per_example = 1

[orchestrator.eval.env.args]
task = "math"
num_examples = 50
pool_size = 300
min_distractors = 10
metric = "ndcg@50"
doc_max_chars = 4000
seed = 42
max_iterations = 20
sub_max_tokens = 4096
min_iterations = 1
min_subcall = 0
enable_sub_llm = false
max_rollout_seconds = 1800
user_prologue = """Note on this retrieval task's `context` (a `list[str]` of candidate documents, one per element):
  - `len(context)` is the FULL candidate pool — mostly irrelevant distractors, with a handful of true matches mixed in. You cannot judge relevance from memory.
  - Strategy: delegate reading to `llm_query` / `llm_query_batched` over the candidate docs to score each one's relevance to the query (the analogical match described in the prompt), Python-sort by that score, and output a FULL ranking of all candidate doc_ids best-first. Borderline candidates go lower, not dropped, so they still count toward recall@50/@100. Do not try to read every doc inline."""
